<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>웍 트럭 - 볶음밥 푸드트럭 시뮬레이터</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div id="top">
        <div class="panel" id="status">
          <div><b id="day">1일차</b> <span id="clock">⏱ 2:30</span></div>
          <div>💰 <b id="money">0</b>원 · ⭐ <b id="rating">-</b></div>
        </div>
        <div class="panel hidden" id="ticket">
          <div id="ticket-name"></div>
          <div id="ticket-ings"></div>
          <div class="bar"><div id="patience"></div></div>
        </div>
        <button class="panel icon" id="mute" aria-label="소리 켜기/끄기">🔊</button>
      </div>

      <div class="panel" id="gauge">
        <div class="glabel">익힘 <span id="cook-text">-</span></div>
        <div class="bar cook"><div class="zone"></div><div id="cook-fill"></div></div>
        <div class="gsmall"><span>남은 양 <b id="amount">-</b></span><span>탄 재료 <b id="burnt">-</b></span></div>
        <div class="glabel toss">🔥 웍질 보너스 <span id="toss-text">-</span></div>
        <div class="bar toss"><div id="toss-fill"></div></div>
      </div>

      <div id="bubble" class="hidden"></div>
      <div id="hint">웍을 누른 채로 끌어서 흔드세요 · 높이 띄울수록 보너스!</div>
      <div id="toasts"></div>
      <div id="tosspops"></div>

      <div id="bottom">
        <div id="ings"></div>
        <div id="actions">
          <button id="trash">🗑️ 버리기</button>
          <button id="serve">🍽️ 내놓기</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="title">
      <div class="card">
        <h1>🔥 웍 트럭</h1>
        <p class="sub">불맛 볶음밥 푸드트럭 시뮬레이터</p>
        <ol>
          <li>손님의 <b>주문서</b>를 보고 재료를 웍에 넣으세요.</li>
          <li>웍을 <b>누른 채로 끌어서</b> 흔들어 골고루 볶으세요.<br />재료를 <b>높이 띄울수록 웍질 보너스</b>! 단, 웍 밖으로 튀면 양이 줄고, 너무 오래 볶으면 탑니다.</li>
          <li>익힘 게이지가 초록 구간에 오면 <b>내놓기</b>!</li>
        </ol>
        <button id="start">장사 시작</button>
      </div>
    </div>

    <div class="overlay hidden" id="dayend">
      <div class="card">
        <h1 id="end-title">1일차 마감</h1>
        <div id="end-body"></div>
        <button id="next">다음 날 장사</button>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
